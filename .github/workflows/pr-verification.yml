name: Athlys2 — PR verification

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "test/**"
      - "tests/**"
      - "specs/**"
      - ".specify/**"
      - ".github/workflows/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: athlys2-pr-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  component-tests:
    name: Athlys2 component tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable PR source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run component tests
        run: node --test
