name: Athlys2 — PR verification

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: athlys2-pr-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  component-tests:
    name: Athlys2 component tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run component tests
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap | tee test-results.tap
      - name: Hash test evidence
        if: always()
        shell: bash
        run: |
          if [ -f test-results.tap ]; then sha256sum test-results.tap > test-results.sha256; fi
      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          if [ -f test-results.tap ]; then
            echo '## Athlys2 test evidence' >> "$GITHUB_STEP_SUMMARY"
            cat test-results.tap >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Athlys2 test evidence unavailable: test process did not produce output.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: athlys2-test-evidence-${{ github.sha }}
          path: |
            test-results.tap
            test-results.sha256
          if-no-files-found: warn
          retention-days: 90
