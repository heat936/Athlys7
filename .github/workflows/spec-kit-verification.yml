name: Component tests and manual Spec Kit audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: athlys-manual-audit-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Manual component verification
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run component tests
        run: node --test
      - name: Set up uv for the official Spec Kit audit
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Install and audit the pinned official Spec Kit CLI
        run: |
          set -euo pipefail
          uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@979b0a3c1277283371c9901ad0eed04b64a99997
          specify --version
          specify check
          specify --help
          specify init --help
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cd "$tmpdir"
          specify init . --non-interactive --ignore-agent-tools
          test -d .specify
          test -n "$(find .specify -maxdepth 3 -type f -print -quit)"
