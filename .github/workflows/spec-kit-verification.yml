name: Component tests and manual Spec Kit audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: athlys-manual-audit-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Manual component verification
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run component tests
        run: node --test
      - name: Set up uv for the official Spec Kit audit
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install and audit the pinned official Spec Kit CLI
        run: |
          set -euo pipefail
          uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@979b0a3c1277283371c9901ad0eed04b64a99997
          specify --version
          specify check
          specify --help
          specify init --help
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cd "$tmpdir"
          specify init . --non-interactive --ignore-agent-tools
          test -d .specify
          test -n "$(find .specify -maxdepth 3 -type f -print -quit)"
